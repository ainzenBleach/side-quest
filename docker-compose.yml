services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sidequest}
      MYSQL_USER: ${DB_USER:-sidequest}
      MYSQL_PASSWORD: ${DB_PASS:-sidequest}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sidequest_root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-sidequest}
      DB_PASS: ${DB_PASS:-sidequest}
      DB_NAME: ${DB_NAME:-sidequest}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/tasks', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
